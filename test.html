<button onclick="openCMD()">Open CMD</button>
<script>
function openCMD() {
  var oShell = new ActiveXObject("WScript.Shell");
  oShell.Run("cmd.exe /k dir");
}
  </script>
<h2>Enter Your Username</h2>
  <form id="usernameForm">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>
    <button type="submit">Save</button>
  </form>

  <p id="message"></p>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Check if a username is already saved and display it
      const savedUsername = localStorage.getItem('username');
      const message = document.getElementById('message');

      if (savedUsername) {
        message.textContent = `Welcome back, ${savedUsername}!`;
      }

      // Form submission handler
      const form = document.getElementById('usernameForm');
      form.addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent form from refreshing the page

        // Get the entered username
        const usernameInput = document.getElementById('username').value;

        // Save the username in localStorage
        localStorage.setItem('username', usernameInput);

        // Display a message
        message.textContent = `Username saved: ${usernameInput}`;
      });
    });
  </script>
